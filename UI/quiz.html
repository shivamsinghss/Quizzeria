<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Game</title>
    <link rel="stylesheet" href="quiz-style.css">
</head>
<body>
<!-- Brick Wall Background -->
<div class="brick-bg"></div>

<div class="quiz-container">
    <!-- Category Title -->
    <h1 id="categoryTitle">Category: Math</h1>

    <!-- Question Container -->
    <div id="questionContainer" class="question-container">
        <div id="questionText" class="question-text"></div>
        <div id="optionsContainer" class="options-container"></div>
    </div>

    <!-- Feedback -->
    <div id="feedback" class="feedback"></div>

    <!-- Sound Controls -->
    <div class="sound-controls">
        <button id="soundToggle" class="btn">🔊 Sound</button>
    </div>

    <!-- Score Container -->
    <div id="scoreContainer" class="score-container hidden">
        <h2>Game Over!</h2>
        <p id="finalScore"></p>
        <button id="restartBtn" class="btn replay-btn">Play Again</button>
    </div>
</div>

<!-- Audio -->
<audio id="correctSound" src="correct.mp3"></audio>
<audio id="wrongSound" src="incorrect.mp3"></audio>

<!-- JS -->
<script src="quiz-script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
</body>
</html>
